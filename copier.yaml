---
_min_copier_version: "9.6.0"
_subdirectory: template
_template_suffix: .jinja
_envops:
  autoescape: false
  keep_trailing_newline: true
_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader
  - extensions/git.py:GitExtension
  - extensions/slugify.py:SlugifyExtension
  - extensions/today.py:TodayExtension
  - jinja2.ext.ExprStmtExtension
_skip_if_exists:
  - CHANGELOG.md
_preserve_symlinks: true
_message_after_copy: |
  {{ project_name }} has been created!

  1. Change directory:

     $ cd {{ _copier_conf.dst_path }}

  2. Create an empty Git repository:

     $ git init
     $ git branch -M {{ integration_branch }}

  {% if public_github %}
  3. Add your GitHub repository to remotes:

     $ git remote add origin {{ repository_url }}.git

  4. Push your integration branch to GitHub:

     $ git add .
     $ git commit -m "Initial commit"
     $ git push -u origin {{ integration_branch }}
  {% else %}
  3. Commit the generated project:

     $ git add .
     $ git commit -m "Initial commit"
  {% endif %}

project_name:
  type: str
  help: Your project name?
  validator: >-
    {% if project_name == '' %}
    The name is required.
    {% endif %}

distribution_name:
  type: str
  help: What is the distribution name (used by pip)?
  default: "{{ project_name | slugify }}"
  validator: >-
    {% set alphanumeric = 'abcdefghijklmnopqrstuvwxyz0123456789' %}
    {% set allowed = alphanumeric ~ '-' %}
    {% if not distribution_name
       or distribution_name[0] not in alphanumeric
       or distribution_name[-1] not in alphanumeric
       or '--' in distribution_name
       or distribution_name | select('in', allowed) | list | length != distribution_name | length %}
    Enter a normalized distribution name using lowercase letters, numbers, and single hyphens, starting and ending with a letter or number.
    {% endif %}

package_name:
  type: str
  help: Your package name.
  default: "{{ project_name | slugify('_') }}"
  when: false

project_description:
  type: str
  help: Your project description?

public_github:
  type: bool
  help: Will this project have a public GitHub repository?
  default: true

github_actions:
  type: bool
  help: Generate GitHub Actions workflows?
  default: "{{ public_github }}"

pypi_publish:
  type: bool
  help: Set up PyPI publishing?
  default: "{{ public_github }}"

package_manager:
  type: str
  help: Which package manager do you want to use?
  default: uv
  choices:
    uv: uv
    Pixi: pixi
    Mamba: mamba

mamba_environment_name:
  type: str
  help: What is the Mamba environment name?
  default: "{{ distribution_name }}"
  when: "{{ package_manager == 'mamba' }}"
  validator: >-
    {% set allowed = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-._' %}
    {% set first = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' %}
    {% if not mamba_environment_name
       or mamba_environment_name[0] not in first
       or mamba_environment_name | select('in', allowed) | list | length != mamba_environment_name | length
       or mamba_environment_name | lower == 'base' %}
    Enter a non-reserved environment name using letters, numbers, hyphens, underscores, and dots, starting with a letter or number.
    {% endif %}

integration_branch:
  type: str
  help: What is the integration branch name?
  default: master
  validator: >-
    {% set allowed = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-._/' %}
    {% set invalid = namespace(value=false) %}
    {% for component in integration_branch.split('/') %}
    {% if component.startswith('.') or component.endswith('.lock') %}
    {% set invalid.value = true %}
    {% endif %}
    {% endfor %}
    {% if not integration_branch or integration_branch == 'HEAD'
       or integration_branch | select('in', allowed) | list | length != integration_branch | length
       or integration_branch.startswith(('-', '/', '.')) or integration_branch.endswith(('/', '.'))
       or '..' in integration_branch or '//' in integration_branch or invalid.value %}
    Enter a valid Git branch name using letters, numbers, hyphens, underscores, dots, and slashes.
    {% endif %}

typecheck_level:
  type: str
  help: How strictly should mypy check the project?
  default: >-
    {{ 'strict' if 'require_typecheck' in _copier_answers
       and 'typecheck_level' not in _copier_answers
       and 'require_typecheck' not in _copier_conf.data else 'basic' }}
  choices:
    None: none
    Basic: basic
    Strict: strict

typecheck_source_only:
  type: bool
  help: Type-check only the package source, excluding tests and tooling?
  default: true

require_typecheck:
  type: bool
  help: Require passing type checks for merging and releasing?
  default: false

changelog:
  type: bool
  help: Use a changelog and Towncrier?
  default: true

annotated_tags_only:
  type: bool
  help: Derive versions only from annotated Git tags, ignoring lightweight tags?
  default: true

minimum_python:
  type: str
  help: What is the minimum supported Python version?
  default: "3.13"
  choices:
    Python 3.13: "3.13"
    Python 3.14: "3.14"
    Python 3.15: "3.15"

target_python:
  type: str
  help: Which Python version should development tools and the default interpreter target?
  default: py315
  choices:
    Python 3.13: py313
    Python 3.14: py314
    Python 3.15: py315
  validator: >-
    {% if target_python[3:] | int < minimum_python.split('.')[1] | int %}
    The target Python version must be at least the minimum supported version.
    {% endif %}

pytest_testmon:
  type: str
  help: Use pytest-testmon to select tests affected by changes?
  default: "no"
  choices:
    No: "no"
    Manually with --testmon: manual
    Automatically by default: automatic

user_name:
  type: str
  help: Your name?
  default: "{{ git_user_name }}"

user_email:
  type: str
  help: Your email?
  default: "{{ git_user_email }}"

github_user:
  type: str
  help: Your GitHub username?
  default: sztal
  when: "{{ public_github }}"

repository_path:
  type: str
  help: Your GitHub repository path.
  default: "{{ (github_user ~ '/' ~ distribution_name) if public_github else '' }}"
  when: false

repository_url:
  type: str
  help: Your GitHub repository URL.
  default: "{{ ('https://github.com/' ~ repository_path) if public_github else '' }}"
  when: false

documentation_url:
  type: str
  help: Your GitHub Pages URL.
  default: "{{ ('https://' ~ github_user ~ '.github.io/' ~ distribution_name) if public_github else '' }}"
  when: false

copyright_owner:
  type: str
  help: The copyright owner.
  default: "{{ user_name }}"
  when: false

copyright_year:
  type: str
  help: The copyright year.
  default: "{{ today.year }}"
  when: false

license:
  type: str
  help: Which open-source license do you want to use?
  default: MIT
  choices:
    Apache License 2.0: Apache-2.0
    BSD 3-Clause "New" or "Revised" License: BSD-3-Clause
    GNU General Public License v3.0 only: GPL-3.0-only
    GNU Lesser General Public License v3.0 only: LGPL-3.0
    MIT License: MIT
    Mozilla Public License 2.0: MPL-2.0
    No license: none

dynamic_version:
  type: bool
  help: Whether the version is dynamic.
  default: true
  when: false

legacy_namespace_layout:
  type: bool
  help: Whether the previous answer used the legacy namespace layout.
  default: >-
    {{ (package_layout | default('')) == 'namespace' or
       ('namespace_name' in _copier_answers and 'package_type' not in _copier_answers
        and 'namespace_name' not in _copier_conf.data) }}
  when: false

package_layout:
  type: str
  help: Which package layout do you want to use?
  default: "{{ 'flat' if legacy_namespace_layout else 'src' }}"
  choices:
    Flat package: flat
    Source package: src
  validator: >-
    {% if package_layout not in ['flat', 'src'] %}
    Choose either flat or src.
    {% endif %}

package_type:
  type: str
  help: What kind of package do you want to create?
  default: "{{ 'namespace' if legacy_namespace_layout else 'standard' }}"
  choices:
    Standard package: standard
    Namespace package: namespace
  validator: >-
    {% if package_type not in ['standard', 'namespace'] %}
    Choose either standard or namespace.
    {% endif %}

namespace_name:
  type: str
  help: What is the top-level namespace name?
  default: "{{ package_name }}"
  when: "{{ package_type == 'namespace' }}"
  validator: >-
    {% if not (namespace_name | python_identifier) %}
    The namespace name must be a valid Python identifier and not a keyword.
    {% elif namespace_name in ['tests', 'scripts'] %}
    This namespace conflicts with a generated top-level package; choose another name.
    {% endif %}

package_root:
  type: str
  help: The package source root.
  default: "{{ 'src' if package_layout == 'src' else '.' }}"
  when: false

package_path:
  type: str
  help: The package path.
  default: "{{ package_root }}/{{ (namespace_name ~ '/') if package_type == 'namespace' else '' }}{{ package_name }}"
  when: false

import_name:
  type: str
  help: The fully qualified import name.
  default: "{{ (namespace_name ~ '.') if package_type == 'namespace' else '' }}{{ package_name }}"
  when: false

code_of_conduct:
  type: bool
  help: Do you want to include a Code of Conduct?
  default: false

entry_points:
  type: str
  help: Which entry points do you want to add?
  multiselect: true
  default: []
  choices:
    Command-line interface: cli

cli:
  type: str
  help: Which CLI framework do you want to use?
  when: "{{ 'cli' in entry_points }}"
  choices:
    argparse: argparse
    Click: click
    Typer: typer
    Cyclopts: cyclopts

nox:
  type: bool
  help: Set up Nox for local testing and checks?
  default: >-
    {{ 'tasks' in _copier_answers['features']
       if 'features' in _copier_answers
       and 'features' not in _copier_conf.data else true }}

features:
  type: str
  help: Which additional features do you want to use?
  multiselect: true
  default: [docs]
  choices: |-
    {% if 'tasks' in _copier_answers.get('features', []) or 'tasks' in _copier_conf.data.get('features', []) %}
    Legacy task automation: tasks
    {% endif %}
    Documentation: docs
    Test interactive Python examples: doctest

install:
  type: str
  help: How do you want to install dependencies for Nox sessions?
  default: uv sync
  when: "{{ nox and package_manager == 'uv' }}"
  choices:
    Install latest versions: uv pip
    Install locked versions: uv sync

docs:
  type: str
  help: Documentation backend.
  default: "{{ 'zensical' if 'docs' in features else '' }}"
  when: false

doctest:
  type: str
  help: Which interactive Python examples do you want to test?
  when: "{{ 'doctest' in features }}"
  multiselect: true
  default: []
  choices:
    Docstrings: docstrings
    Documentation:
      value: docs
      validator: "{% if not docs %}requires documentation{% endif %}"
    README: readme
